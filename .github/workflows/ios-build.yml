name: iOS Build

# 在云端 macOS runner 上用 XcodeGen 生成工程并编译（模拟器，无需签名），
# 用于在没有本地 Mac 的情况下验证 iOS 工程是否可编译。
on:
  push:
    # 仅分支 push 时按 paths 触发；不限定 branches 会导致 tag push 也触发本工作流，
    # 造成一个端前缀 tag 误触发本 iOS 编译校验（详见 VERSIONING.md 的端隔离原则）。
    branches: [main, master]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  # PR 合并前的编译门禁：改动 ios/ 的 PR 必须先编过（模拟器，无需签名）才能合并，
  # 挡住「漏函数/语法错直接进主干再打 ios-v tag」这类事故（发 TestFlight 前就变红）。
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:
    inputs:
      social_core_only:
        description: Run social core integration tests without screenshot gallery
        type: boolean
        default: false

jobs:
  build:
    # macos-15 自带 Xcode 16，可读取 XcodeGen 生成的新工程格式(objectVersion 77)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch audited source for the isolated regression comparison
        if: inputs.social_core_only
        run: git fetch --depth=1 origin 9254f66b814f689810e995e5aa7d1fa4acb3749b

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Resolve Swift packages
        working-directory: ios
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Touliao.xcodeproj \
            -scheme Touliao

      - name: Build (iOS Simulator, no signing)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project Touliao.xcodeproj \
            -scheme Touliao \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log

      # 选一台可用的 iOS 模拟器作 test 目标（xcodebuild test 不接受 generic 目标）。
      # 取最后一个可用 iPhone 模拟器的 UDID，避免在 iPad 兼容窗口中审阅手机布局。runner 自带 jq。
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone")) | .udid] | last')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "No available iOS simulator found"; exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator UDID: $UDID"

      - name: Boot selected iPhone simulator
        timeout-minutes: 5
        run: |
          xcrun simctl boot '${{ steps.sim.outputs.udid }}' || true
          xcrun simctl bootstatus '${{ steps.sim.outputs.udid }}' -b
          xcrun simctl list devices booted -j > ios/native-simulator.json

      - name: Reproduce cache leak on audited baseline in isolated runner
        if: inputs.social_core_only
        working-directory: ios
        run: |
          set -euo pipefail
          original_file=$(mktemp)
          cp Touliao/Features/Chat/ChatViewModel.swift "$original_file"
          trap 'cp "$original_file" Touliao/Features/Chat/ChatViewModel.swift; rm -f "$original_file"' EXIT
          git show 9254f66b814f689810e995e5aa7d1fa4acb3749b:ios/Touliao/Features/Chat/ChatViewModel.swift > Touliao/Features/Chat/ChatViewModel.swift
          result=0
          xcodebuild test -project Touliao.xcodeproj -scheme Touliao \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug -parallel-testing-enabled NO \
            -only-testing:TouliaoTests/NativeUIReviewTests/testSocial011CacheIsNotRenderedBeforePrivacyPolicy \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            CODE_SIGN_ENTITLEMENTS="$GITHUB_WORKSPACE/scripts/native-review/Simulator.entitlements" \
            > social-cache-baseline.log 2>&1 || result=$?
          cp "$original_file" Touliao/Features/Chat/ChatViewModel.swift
          python3 - "$result" <<'PYBASELINE'
          import sys
          from pathlib import Path
          text = Path('social-cache-baseline.log').read_text()
          assert int(sys.argv[1]) != 0, 'Old cache behavior unexpectedly passed'
          assert 'synchronous cache restore must wait for privacy policy' in text, 'Failure must be the privacy assertion, not a build/environment error'
          print('Audited baseline reproduced the cache privacy failure; current source restored.')
          PYBASELINE

      # 单测门禁：含离线消息缓存 MsgCacheStore 语义基线（与 Web vitest / Android JUnit 三端对齐）。
      - name: Unit tests (TouliaoTests, iOS Simulator)
        id: native_tests
        working-directory: ios
        run: |
          set -o pipefail
          social_tests=(-only-testing:TouliaoTests)
          if [ '${{ inputs.social_core_only }}' = 'true' ]; then
            social_tests=(-only-testing:TouliaoTests/DraftIsolationTests -only-testing:TouliaoTests/SocialReadGuardTests -only-testing:TouliaoTests/CredentialIsolationTests -only-testing:TouliaoTests/OutboxIsolationTests -only-testing:TouliaoTests/MsgCacheStoreTests -only-testing:TouliaoTests/NativeUIReviewTests/testSocial001RealChatViewModelsKeepDraftOwners -only-testing:TouliaoTests/NativeUIReviewTests/testSocial008InvalidationRefreshesRealContactsViewModel -only-testing:TouliaoTests/NativeUIReviewTests/testSocial011CacheIsNotRenderedBeforePrivacyPolicy)
          fi
          xcodebuild test \
            -project Touliao.xcodeproj \
            -scheme Touliao \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 300 \
            "${social_tests[@]}" \
            -resultBundlePath NativeReview.xcresult \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            CODE_SIGN_ENTITLEMENTS="$GITHUB_WORKSPACE/scripts/native-review/Simulator.entitlements" \
            | tee xcodebuild-test.log

      - name: Collect native simulator screenshots
        if: always() && steps.sim.outputs.udid != ''
        run: |
          container=$(xcrun simctl get_app_container '${{ steps.sim.outputs.udid }}' com.touliao.app data 2>/dev/null || true)
          if [ -d "$container/Documents/NativeUiReview" ]; then
            cp -R "$container/Documents/NativeUiReview" ios/NativeUiReview
          fi
          if [ -d ios/NativeReview.xcresult ]; then
            xcrun xcresulttool export attachments --path ios/NativeReview.xcresult --output-path ios/NativeAttachments
          fi
          if [ '${{ steps.native_tests.outcome }}' = 'success' ] && [ '${{ inputs.social_core_only }}' != 'true' ]; then
            python3 - <<'PYREVIEW'
          import json
          from pathlib import Path
          images = list(Path('ios/NativeUiReview').glob('*.png'))
          result = {'environment': 'iPhone Simulator, native SwiftUI/UIKit', 'screenshots': len(images), 'hardware': False}
          Path('ios/native-validation.json').write_text(json.dumps(result, indent=2) + '\n')
          assert len(images) >= 75, 'Native screenshot files were not collected'
          print(result)
          PYREVIEW
          fi

      - name: Upload build & test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: |
            ios/xcodebuild.log
            ios/xcodebuild-test.log
            ios/social-cache-baseline.log
            ios/native-validation.json
            ios/NativeAttachments/
            ios/native-simulator.json
            ios/NativeUiReview/
            ios/NativeReview.xcresult/
          if-no-files-found: ignore
