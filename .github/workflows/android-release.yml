name: Android Release APK (signed)

# 云端打「正式签名版」原生 APK（Kotlin/Compose）：用同一套密钥签名，可覆盖升级、可上架。
# 用法：本仓库 → Actions → 「Android Release APK (signed)」→ Run workflow。
# 跑完在运行页底部 Artifacts 下载 touliao-release-apk，同时自动部署到下载站服务器。
# 需要 4 个仓库 Secret：ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
#                       ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD（已配置）。
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the verified APK
        type: boolean
        default: false
  push:
    tags:
      # 仅安卓端专属前缀触发；避免裸 v* 同时误触发桌面端/iOS 发布（详见 VERSIONING.md）。
      - 'android-v*'

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Preserve current public Android baseline
        run: |
          mkdir -p android-release-evidence
          curl --fail --silent --show-error --retry 3 --max-time 45 https://touliao.cc/downloads/touliao-android-version.json -o android-release-evidence/previous-version.json
          curl --fail --silent --show-error --retry 3 --max-time 240 https://touliao.cc/downloads/touliao-android-latest.apk -o android-release-evidence/previous.apk

      - name: Verify publication transaction and rollback guards
        run: python3 -B scripts/test-android-publish.py -v

      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::缺少 ANDROID_KEYSTORE_BASE64 secret"; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/touliao-release.jks"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/touliao-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # 个推 SDK manifestPlaceholders（未配置时为空串，SDK 以 no-op 运行）
          GETUI_APP_ID: ${{ secrets.GETUI_APP_ID }}
          GETUI_APP_KEY: ${{ secrets.GETUI_APP_KEY }}
          GETUI_APP_SECRET: ${{ secrets.GETUI_APP_SECRET }}
        run: |
          # 正式包只含 arm64-v8a/armeabi-v7a。先额外打一份带 x86_64 的同签名包，仅供下方
          # x86_64 模拟器冒烟测试安装；随后用默认 ABI 重新打包（R8/dex 任务 up-to-date，只重做打包），
          # 输出路径上留下的 app-release.apk 才是要校验与发布的正式包。
          ./gradlew testDebugUnitTest assembleRelease -PtouliaoAbis=arm64-v8a,armeabi-v7a,x86_64 --stacktrace --no-daemon
          mkdir -p "$RUNNER_TEMP/smoke-apk"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/smoke-apk/app-release-x86_64.apk"
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Smoke-test APK must match release APK except x86_64 native libs
        run: |
          python3 - "$RUNNER_TEMP/smoke-apk/app-release-x86_64.apk" android/app/build/outputs/apk/release/app-release.apk <<'PY'
          import re, sys, zipfile
          def entries(path, drop):
              with zipfile.ZipFile(path) as z:
                  return {i.filename: i.CRC for i in z.infolist()
                          if not drop(i.filename) and not re.fullmatch(r"META-INF/[^/]+\.(SF|RSA|EC|DSA|MF)", i.filename)}
          smoke = entries(sys.argv[1], lambda n: n.startswith("lib/x86_64/"))
          release = entries(sys.argv[2], lambda n: False)
          if smoke != release:
              diff = sorted(set(smoke.items()) ^ set(release.items()))[:20]
              sys.exit(f"Smoke-test APK diverges from release APK: {diff}")
          with zipfile.ZipFile(sys.argv[1]) as z:
              if not any(n.startswith("lib/x86_64/") for n in z.namelist()):
                  sys.exit("Smoke-test APK lacks x86_64 libs")
          print(f"smoke APK == release APK + lib/x86_64 ({len(release)} entries compared)")
          PY

      - name: Verify production identity signature and upgrade version
        run: |
          python3 scripts/verify-android-release.py --apk android/app/build/outputs/apk/release/app-release.apk --baseline-apk android-release-evidence/previous.apk --baseline-manifest android-release-evidence/previous-version.json --output android-release-evidence

      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm

      # 升级冒烟要先装「当前线上包」(previous.apk)。正式包自 8.1.5x 起只带 arm64-v8a/armeabi-v7a，
      # 而 API 29 default x86_64 镜像没有 ARM 翻译，装 ARM-only 的旧包会 INSTALL_FAILED_NO_MATCHING_ABIS，
      # 从这之后的每一次发版都会卡在这里。按旧包实际带的 ABI 选镜像：
      #   旧包带 x86_64（或不含原生库）→ 沿用已验证的 API 29 default；
      #   旧包只有 ARM 库 → API 30 google_apis x86_64（Android 11 起 x86_64 镜像自带 ARM 翻译，可 adb root）。
      # 新包始终是带 lib/x86_64 的冒烟包，两种镜像都原生运行。
      - name: Choose upgrade-smoke emulator image for the previous APK's ABIs
        id: smoke_image
        run: |
          python3 - android-release-evidence/previous.apk >> "$GITHUB_OUTPUT" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              abis = sorted({n.split('/')[1] for n in z.namelist() if n.startswith('lib/') and n.count('/') >= 2})
          native_x86 = not abis or 'x86_64' in abis
          print(f"abis={','.join(abis) or 'none'}")
          print(f"api={29 if native_x86 else 30}")
          print(f"target={'default' if native_x86 else 'google_apis'}")
          print(f"translation={'false' if native_x86 else 'true'}")
          PY
          cat "$GITHUB_OUTPUT"

      - name: Installed release APK startup and in-place upgrade regression
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SMOKE_ENVIRONMENT: Android API ${{ steps.smoke_image.outputs.api }} ${{ steps.smoke_image.outputs.target }} x86_64 emulator
          SMOKE_ARM_TRANSLATION: ${{ steps.smoke_image.outputs.translation }}
        with:
          api-level: ${{ steps.smoke_image.outputs.api }}
          arch: x86_64
          target: ${{ steps.smoke_image.outputs.target }}
          disable-animations: true
          # 安装的是与正式包 dex/资源/签名逐项一致、仅额外带 lib/x86_64 的冒烟包（见上一步校验）
          script: bash scripts/android-upgrade-smoke.sh android-release-evidence/previous.apk ${{ runner.temp }}/smoke-apk/app-release-x86_64.apk

      - name: Upload startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-startup-evidence
          path: android-startup-evidence/
          if-no-files-found: ignore

      - name: Upload R8 mapping (crash deobfuscation)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-r8-mapping
          path: |
            android/app/build/outputs/mapping/release/mapping.txt
            android/app/build/outputs/mapping/release/configuration.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Upload signed APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touliao-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish verified Android downloads with rollback backup
        if: success() && (startsWith(github.ref, 'refs/tags/android-v') || inputs.deploy == true)
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_SERVER_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash scripts/publish-android-release.sh android/app/build/outputs/apk/release/app-release.apk

      - name: Upload release verification and publication receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-verification
          path: |
            android-release-evidence/*.json
            android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: error

      - name: Remove signing and deployment keys
        if: always()
        run: rm -f "$RUNNER_TEMP/touliao-release.jks" "$RUNNER_TEMP/touliao-release-deploy-key"
