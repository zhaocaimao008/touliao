name: Android Release APK (signed)

# 云端打「正式签名版」原生 APK（Kotlin/Compose）：用同一套密钥签名，可覆盖升级、可上架。
# 用法：本仓库 → Actions → 「Android Release APK (signed)」→ Run workflow。
# 跑完在运行页底部 Artifacts 下载 touliao-release-apk，同时自动部署到香港服务器。
# 需要 4 个仓库 Secret：ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
#                       ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD（已配置）。
on:
  workflow_dispatch:
  push:
    tags:
      # 仅安卓端专属前缀触发；避免裸 v* 同时误触发桌面端/iOS 发布（详见 VERSIONING.md）。
      - 'android-v*'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::缺少 ANDROID_KEYSTORE_BASE64 secret"; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/touliao-release.jks"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/touliao-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # 个推 SDK manifestPlaceholders（未配置时为空串，SDK 以 no-op 运行）
          GETUI_APP_ID: ${{ secrets.GETUI_APP_ID }}
          GETUI_APP_KEY: ${{ secrets.GETUI_APP_KEY }}
          GETUI_APP_SECRET: ${{ secrets.GETUI_APP_SECRET }}
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload signed APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touliao-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      # ── 部署到服务器（2026-08-30 加固，对齐 deploy.yml 的模式）──────────
      # 此前这一步没做 secret 检测，DEPLOY_SSH_KEY/DEPLOY_USER/DEPLOY_SERVER_HOST 缺失时
      # ssh 命令必然失败，整个 step 直接标红——问题不是"显示成功"，而是失败发生在
      # sha256/version.json 生成代码*之前*，导致这几行代码从未被真正跑到过（详见
      # AUDIT.md 相关章节）。这次拆成三步：①secret 检测（缺失就让 job 明确失败，不
      # 静默跳过、不显示假绿灯）②版本清单生成（纯本地计算，不依赖网络/SSH，即使后面
      # 部署失败这一步的产物也已经生成、日志里能看到）③真正的网络部署。
      - name: 检查部署 secret 是否已配置
        if: success()
        run: |
          missing=()
          [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]     && missing+=("DEPLOY_SSH_KEY")
          [ -z "${{ secrets.DEPLOY_USER }}" ]        && missing+=("DEPLOY_USER")
          [ -z "${{ secrets.DEPLOY_SERVER_HOST }}" ] && missing+=("DEPLOY_SERVER_HOST")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::缺少部署所需的 secret：${missing[*]}。APK 已构建完成（见上方 Upload signed APK 产物，可手动下载），但无法自动部署到服务器、无法更新 version.json——请到仓库 Settings → Secrets and variables → Actions 配置后重新触发本 workflow，或手动下载 Artifact 后按 deploy/README.md 的流程手动部署。"
            exit 1
          fi
          echo "✅ 部署所需 secret 齐全"

      - name: 生成版本清单（本地计算，先于网络部署）
        id: version
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          # 从 build.gradle.kts 读出真实版本，生成 version.json。
          # 安卓端"检查更新"靠这个文件比对版本；不同步会导致存量用户拉不到更新提示。
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts | head -1)
          VC=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' android/app/build.gradle.kts | head -1)
          # sha256 供客户端 ApkDownloader 下载完成后校验，防更新host被中间人/被攻破后
          # 替换成别的文件。对刚打包好的同一份 $APK 算哈希（已在磁盘上是最终产物，纯
          # 顺序shell脚本，不存在electron那次遇到的"签名时机早于文件写完"的竞态）。
          SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "版本清单: versionName=$VN versionCode=$VC sha256=$SHA256"
          printf '{\n  "versionCode": %s,\n  "versionName": "%s",\n  "url": "https://touliao.cc/downloads/touliao-android-latest.apk",\n  "notes": "当前最新版本 %s。",\n  "sha256": "%s"\n}\n' "$VC" "$VN" "$VN" "$SHA256" > /tmp/touliao-android-version.json
          cat /tmp/touliao-android-version.json

      - name: 部署 APK + 版本清单到香港服务器
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          APK="${{ steps.version.outputs.apk_path }}"
          echo "部署: $APK → /var/www/touliao-downloads/touliao-android-latest.apk"
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p /var/www/touliao-downloads"
          scp -i ~/.ssh/deploy_key "$APK" "${DEPLOY_USER}@${DEPLOY_HOST}:/var/www/touliao-downloads/touliao-android-latest.apk"
          echo "✅ APK 已发布到 https://touliao.cc/downloads/touliao-android-latest.apk"
          scp -i ~/.ssh/deploy_key /tmp/touliao-android-version.json "${DEPLOY_USER}@${DEPLOY_HOST}:/var/www/touliao-downloads/touliao-android-version.json"
          echo "✅ 版本清单已发布到 https://touliao.cc/downloads/touliao-android-version.json"
