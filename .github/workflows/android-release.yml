name: Android Release APK (signed)

# 云端打「正式签名版」原生 APK（Kotlin/Compose）：用同一套密钥签名，可覆盖升级、可上架。
# 用法：本仓库 → Actions → 「Android Release APK (signed)」→ Run workflow。
# 跑完在运行页底部 Artifacts 下载 touliao-release-apk，同时自动部署到下载站服务器。
# 需要 4 个仓库 Secret：ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
#                       ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD（已配置）。
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the verified APK
        type: boolean
        default: false
  push:
    tags:
      # 仅安卓端专属前缀触发；避免裸 v* 同时误触发桌面端/iOS 发布（详见 VERSIONING.md）。
      - 'android-v*'

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Preserve current public Android baseline
        run: |
          mkdir -p android-release-evidence
          curl --fail --silent --show-error --retry 3 --max-time 45 https://touliao.cc/downloads/touliao-android-version.json -o android-release-evidence/previous-version.json
          curl --fail --silent --show-error --retry 3 --max-time 240 https://touliao.cc/downloads/touliao-android-latest.apk -o android-release-evidence/previous.apk

      - name: Verify publication transaction and rollback guards
        run: python3 -B scripts/test-android-publish.py -v

      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::缺少 ANDROID_KEYSTORE_BASE64 secret"; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/touliao-release.jks"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/touliao-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # 个推 SDK manifestPlaceholders（未配置时为空串，SDK 以 no-op 运行）
          GETUI_APP_ID: ${{ secrets.GETUI_APP_ID }}
          GETUI_APP_KEY: ${{ secrets.GETUI_APP_KEY }}
          GETUI_APP_SECRET: ${{ secrets.GETUI_APP_SECRET }}
        run: |
          ./gradlew testDebugUnitTest assembleRelease --stacktrace --no-daemon

      - name: Verify production identity signature and upgrade version
        run: |
          python3 scripts/verify-android-release.py --apk android/app/build/outputs/apk/release/app-release.apk --baseline-apk android-release-evidence/previous.apk --baseline-manifest android-release-evidence/previous-version.json --output android-release-evidence

      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm

      - name: Installed release APK startup and in-place upgrade regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          script: bash scripts/android-upgrade-smoke.sh android-release-evidence/previous.apk android/app/build/outputs/apk/release/app-release.apk

      - name: Upload startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-startup-evidence
          path: android-startup-evidence/
          if-no-files-found: ignore

      - name: Upload signed APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touliao-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish verified Android downloads with rollback backup
        if: success() && (startsWith(github.ref, 'refs/tags/android-v') || inputs.deploy == true)
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_SERVER_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash scripts/publish-android-release.sh android/app/build/outputs/apk/release/app-release.apk

      - name: Upload release verification and publication receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-verification
          path: |
            android-release-evidence/*.json
            android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: error

      - name: Remove signing and deployment keys
        if: always()
        run: rm -f "$RUNNER_TEMP/touliao-release.jks" "$RUNNER_TEMP/touliao-release-deploy-key"
