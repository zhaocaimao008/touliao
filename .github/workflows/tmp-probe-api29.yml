name: Temp - API 29 signature probe check

# 临时验证：发版新增的「API 29 签名兼容探针」步骤能否用 ARM-only 的正式包在 x86_64 API 29 镜像上跑通。
# 只在推送 ci-tmp/probe-api29-check 分支时运行；验证完删除该分支，不进 main。
on:
  push:
    branches: [ci-tmp/probe-api29-check]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Fetch published ARM-only release APKs (old = 8.1.45, new = 8.1.46)
        run: |
          mkdir -p apks
          curl -fsS --retry 3 https://touliao.cc/downloads/touliao-android-8.1.45.apk -o apks/old.apk
          curl -fsS --retry 3 https://touliao.cc/downloads/touliao-android-8.1.46.apk -o apks/new.apk
          ls -l apks
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: API 29 signature compatibility probe
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          script: bash scripts/legacy-update/run-signature-compat-probe.sh apks/old.apk apks/new.apk evidence/api29
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api29-probe-evidence
          path: evidence/api29/signature-compatibility.json
          if-no-files-found: warn
