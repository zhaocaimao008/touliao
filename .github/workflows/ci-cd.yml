name: v信 CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 1. 代码检查和测试
  test:
    name: 测试和代码检查
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
      
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend-v2/package-lock.json
            web/package-lock.json
      
      - name: 安装后端依赖
        working-directory: ./backend-v2
        run: npm ci
      
      - name: 安装前端依赖
        working-directory: ./web
        run: npm ci
      
      - name: 后端代码检查
        working-directory: ./backend-v2
        run: npm run lint || echo "Lint not configured"
      
      - name: 后端测试
        working-directory: ./backend-v2
        run: npm test
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          NODE_ENV: test
      
      - name: 前端代码检查
        working-directory: ./web
        run: npm run lint || echo "Lint not configured"
      
      - name: 前端构建测试
        working-directory: ./web
        run: npm run build
      
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            backend-v2/coverage/
            backend-v2/test-results/
          retention-days: 30

  # 2. 构建 Docker 镜像
  build:
    name: 构建 Docker 镜像
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
      
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 提取 Docker 元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
      
      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v5
        with:
          context: ./backend-v2
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: 构建前端
        working-directory: ./web
        run: |
          npm ci
          npm run build
      
      - name: 上传前端构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/dist/
          retention-days: 7

  # 3. 部署到生产环境
  deploy:
    name: 部署到生产环境
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://dipsin.com
    
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
      
      - name: 下载前端构建产物
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./web/dist
      
      - name: 部署到服务器
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /root/v信
            git pull origin main
            
            # 备份数据库
            /usr/local/bin/backup-vxin-db.sh
            
            # 更新后端
            cd backend-v2
            npm ci --production
            pm2 restart vxin-server-v2
            
            # 更新前端
            cd ../web
            npm ci
            npm run build
            sudo systemctl reload nginx
            
            # 验证部署
            sleep 5
            curl -f https://dipsin.com/health || exit 1
      
      - name: 部署通知
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: '部署 ${{ job.status }}: v信 ${{ github.sha }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

  # 4. 性能测试
  performance:
    name: 性能回归测试
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
      
      - name: 安装 K6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
      
      - name: 运行性能测试
        run: |
          cat > perf-test.js << 'JSEOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';

          export const options = {
            stages: [
              { duration: '30s', target: 20 },
              { duration: '1m', target: 50 },
              { duration: '30s', target: 0 },
            ],
            thresholds: {
              http_req_duration: ['p(95)<500'],
              http_req_failed: ['rate<0.05'],
            },
          };

          export default function () {
            const res = http.get('https://dipsin.com/health');
            check(res, {
              'status is 200': (r) => r.status === 200,
              'response time < 500ms': (r) => r.timings.duration < 500,
            });
            sleep(1);
          }
          JSEOF
          k6 run perf-test.js
      
      - name: 上传性能报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: perf-results/
          retention-days: 30
