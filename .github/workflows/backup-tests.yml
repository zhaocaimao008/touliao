name: Backup Safety Tests
on:
  push:
    branches: [main]
    paths: ['deploy/*backup*', 'deploy/migration-*', 'deploy/credential-escrow.cjs', 'scripts/test-backup.cjs', 'scripts/test-migration.py', 'scripts/test-credential-escrow.cjs', '.github/workflows/backup-tests.yml']
  pull_request:
    paths: ['deploy/*backup*', 'deploy/migration-*', 'deploy/credential-escrow.cjs', 'scripts/test-backup.cjs', 'scripts/test-migration.py', 'scripts/test-credential-escrow.cjs', '.github/workflows/backup-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update -qq && sudo apt-get install -y sqlite3 age
      - run: node --test scripts/test-backup.cjs scripts/test-credential-escrow.cjs
      - run: python3 -B scripts/test-migration.py -v
