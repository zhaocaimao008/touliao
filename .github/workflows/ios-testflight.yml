name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 8.1.0)，必填，不再有默认值兜底'
        required: true
      submit_review:
        description: '上传后自动填测试信息并提交外部 Beta 审核'
        type: boolean
        required: false
        default: true
      prepare_only:
        description: '仅构建、验证和导出 IPA，不上传、不送审'
        type: boolean
        required: false
        default: false
      run_simulator_tests:
        description: '归档前运行模拟器测试（准备模式与直接上传均适用；tag 发版总是运行）；仅在相同应用源码已有通过证据时可关闭'
        type: boolean
        required: false
        default: true
      prepared_run_id:
        description: '上传已验证 IPA 的准备运行 ID；填写后不重新构建'
        required: false
        default: ''
      prepared_build_number:
        description: '已验证 IPA 的 Build Number'
        required: false
        default: ''
      prepared_ipa_sha256:
        description: '已验证 IPA 的 SHA-256'
        required: false
        default: ''
      prepare_internal_testing:
        description: '将已处理构建加入内部验收组；不邀请账号，不提交外部审核'
        type: boolean
        required: false
        default: false
      prepared_beta_review:
        description: '将指定已验证构建加入公开测试组并提交 TestFlight 外部 Beta 审核'
        type: boolean
        required: false
        default: false
  push:
    tags:
      # iOS 端专属前缀触发（见 VERSIONING.md 第 2 节）；避免裸 v*/其他端 tag 误触发。
      # 版本号取自 tag（去掉 ios-v 前缀），且 tag 发布默认自动送外部 Beta 审核。
      - 'ios-v*'

jobs:
  upload_prepared:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.prepared_run_id != '' }}
    runs-on: macos-26
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    env:
      UPLOAD_DIR: /tmp/touliao-testflight-upload
      APP_VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ inputs.prepared_build_number }}
      EXPECTED_IPA_SHA256: ${{ inputs.prepared_ipa_sha256 }}
      PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
      PREPARE_INTERNAL_TESTING: ${{ inputs.prepare_internal_testing }}
      PREPARED_BETA_REVIEW: ${{ inputs.prepared_beta_review }}
    steps:
      - uses: actions/checkout@v4
      - name: Check prepared artifact request
        env:
          PREPARE_ONLY: ${{ inputs.prepare_only }}
          SUBMIT_REVIEW: ${{ inputs.submit_review }}
        run: |
          set -euo pipefail
          test "$PREPARE_ONLY" = false
          test "$SUBMIT_REVIEW" = false
          [[ "$PREPARE_INTERNAL_TESTING" != true || "$PREPARED_BETA_REVIEW" != true ]]
          [[ "$PREPARED_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_IPA_SHA256" =~ ^[a-f0-9]{64}$ ]]
          mkdir -p "$UPLOAD_DIR/evidence"
      - name: Download the verified IPA and its evidence
        uses: actions/download-artifact@v4
        with:
          name: touliao-ios-release-preparation
          run-id: ${{ inputs.prepared_run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.UPLOAD_DIR }}/prepared
      - name: Verify artifact identity and check existing TestFlight build
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: bash ios/release-preparation/upload-prepared.sh setup
      - name: Upload the approved IPA to TestFlight
        if: ${{ env.SKIP_IPA_UPLOAD != 'true' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: bash ios/release-preparation/upload-prepared.sh upload
      - name: Wait for the exact build to finish Apple processing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: bash ios/release-preparation/upload-prepared.sh wait
      - name: Submit the exact build for external TestFlight Beta review
        if: ${{ inputs.prepared_beta_review }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: bash ios/release-preparation/upload-prepared.sh beta-review
      - name: Save upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touliao-ios-testflight-upload
          path: ${{ env.UPLOAD_DIR }}/evidence/
          if-no-files-found: warn
      - name: Remove temporary API key
        if: always()
        run: rm -rf "$UPLOAD_DIR/private"

  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.prepare_only && inputs.prepared_run_id == '' }}
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      APP_VERSION: ${{ inputs.version }}
      PREP_DIR: /tmp/touliao-release-preparation
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode and generate project
        run: bash ios/release-preparation/run.sh setup
      - name: Validate signing materials and App Store Connect access (read only)
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: bash ios/release-preparation/run.sh credentials
      - name: Clean simulator build and native tests
        if: ${{ inputs.run_simulator_tests }}
        run: bash ios/release-preparation/run.sh simulator
      - name: Clean signed Release build
        run: bash ios/release-preparation/run.sh build
      - name: Archive
        run: bash ios/release-preparation/run.sh archive
      - name: Verify archive and export signed IPA
        run: bash ios/release-preparation/run.sh export
      - name: Validate final IPA with Apple (no upload)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: bash ios/release-preparation/run.sh validate
      - name: Save IPA and non-secret validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touliao-ios-release-preparation
          path: ${{ env.PREP_DIR }}/evidence/
          if-no-files-found: error
      - name: Remove temporary signing credentials
        if: always()
        run: bash ios/release-preparation/run.sh cleanup

  testflight:
    if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.prepare_only || inputs.prepared_run_id != '')) }}
    # Apple 自 2026-04 起要求用 iOS 26 SDK(Xcode 26)构建才能上传 App Store。
    # macos-15 仅带 Xcode 16(iOS 18 SDK)，会在上传校验时 409。改用 macos-26。
    runs-on: macos-26
    # 模拟器测试 + 归档上传 + 等构建处理 + 两次送审，60 分钟不够
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 解析版本与发布参数（tag 或手动触发通用）
        run: |
          # tag 触发：版本号取自 tag（ios-v8.1.0 → 8.1.0），并默认送外部 Beta 审核；
          # 手动触发：版本号取 inputs.version，是否送审取 inputs.submit_review。
          #
          # 2026-08-30 修复：input 层面的 required:true（已去掉 default）能挡住"UI手动
          # 触发时留空直接提交"，但 workflow_dispatch 也能走 REST API/gh CLI 触发，那条
          # 路径不受 UI 的 required 校验约束，仍可能传入空字符串——这里补一道脚本级硬校验，
          # 空值直接 fail，不再静默兜底成 1.0.0。此前没有这道校验时，连续5次手动触发全部
          # 忘填 version，都误发成了 1.0.0（跟 project.yml 里从未生效的占位值一样，跟
          # Android/Electron 的真实版本线完全脱节），详见 AUDIT.md。
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#ios-v}"
            SUBMIT="true"
          else
            VERSION="${{ github.event.inputs.version }}"
            if [ -z "$VERSION" ]; then
              echo "::error::未指定版本号（version 输入为空）。手动触发本 workflow 必须显式填写 version（如 8.1.0），不再有默认值兜底。"
              exit 1
            fi
            SUBMIT="${{ github.event.inputs.submit_review }}"
            [ -z "$SUBMIT" ] && SUBMIT="true"
          fi
          echo "VERSION=$VERSION"     >> "$GITHUB_ENV"
          echo "SUBMIT_REVIEW=$SUBMIT" >> "$GITHUB_ENV"
          echo "解析结果 → 版本: $VERSION | 送审: $SUBMIT | 触发: ${GITHUB_REF_TYPE}/${GITHUB_REF_NAME}"

      - name: 选择 Xcode 26（满足 App Store iOS 26 SDK 要求）
        run: |
          echo "可用 Xcode:"; ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1); fi
          echo "选用: $XC"
          sudo xcode-select -s "$XC/Contents/Developer"

      - name: Xcode 版本
        run: xcodebuild -version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: ios
        run: xcodegen generate

      # 2026-10-13：tag 发版此前不跑任何测试就归档上传——红灯构建也能送审。这里复用
      # prepare_only 路径的同一套模拟器构建 + TouliaoTests，失败即终止，不归档、不上传、不送审。
      # 手动触发时受 run_simulator_tests 控制（默认开启）；tag 触发总是运行。
      - name: 模拟器构建与原生测试（失败则不归档、不上传）
        if: ${{ github.event_name == 'push' || inputs.run_simulator_tests }}
        env:
          PREP_DIR: /tmp/touliao-release-tests
          APP_VERSION: ${{ env.VERSION }}
        run: bash ios/release-preparation/run.sh simulator

      - name: 保存模拟器测试结果
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: touliao-ios-release-tests
          path: /tmp/touliao-release-tests/evidence/
          if-no-files-found: ignore

      - name: 导入发布证书
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          # 创建临时 keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -l build.keychain

          # 导入证书
          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain

          # 安装 Provisioning Profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/touliao.mobileprovision

      - name: Resolve Swift packages
        working-directory: ios
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Touliao.xcodeproj \
            -scheme Touliao

      - name: 计算 build 号（Unix 时间戳，保证唯一且单调递增）
        id: buildno
        run: |
          # 用构建时刻的 Unix 时间戳作为 CFBundleVersion(build 号)：
          # 天然递增、绝不撞号，无需查 ASC 或依赖 git。远大于历史 build 11。
          BN=$(date -u +%s)
          echo "BUILD_NUMBER=$BN" >> "$GITHUB_ENV"
          echo "build_number=$BN" >> "$GITHUB_OUTPUT"
          echo "本次 build 号: $BN"

      - name: 构建并归档
        working-directory: ios
        env:
          APP_VERSION: ${{ env.VERSION }}
        run: |
          set -o pipefail
          # 签名配置已内置到 project.yml 的 Touliao target（仅 App 主 target），
          # 命令行不再传 CODE_SIGN_*/PROVISIONING_PROFILE_SPECIFIER，否则会被
          # 全局套用到 SPM 依赖(Firebase/Kingfisher)导致
          # "does not support provisioning profiles" 而归档失败。
          # CURRENT_PROJECT_VERSION 用上一步的时间戳 build 号，自动递增。
          xcodebuild archive \
            -project Touliao.xcodeproj \
            -scheme Touliao \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath /tmp/Touliao.xcarchive \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: 导出 IPA
        run: |
          cat > /tmp/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>F2J52VX786</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.touliao.app</key>
              <string>touliao_distribution</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath /tmp/Touliao.xcarchive \
            -exportPath /tmp/touliao-ipa \
            -exportOptionsPlist /tmp/ExportOptions.plist

          ls -lh /tmp/touliao-ipa/

      - name: 上传到 TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          # 写入 API Key 文件
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

          IPA=$(ls /tmp/touliao-ipa/*.ipa | head -1)
          echo "上传: $IPA"

          # 校验后上传到 App Store Connect / TestFlight。
          # altool 会自动从 ~/.appstoreconnect/private_keys 读取 AuthKey_<KEY_ID>.p8。
          # 注：notarytool 仅用于 macOS 公证，不能上传 iOS 到 TestFlight。
          xcrun altool --validate-app \
            -f "$IPA" \
            --type ios \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

          xcrun altool --upload-app \
            -f "$IPA" \
            --type ios \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: 保存 IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touliao-ios-ipa
          path: /tmp/touliao-ipa/*.ipa
          if-no-files-found: ignore

      # ── 自动填测试信息 + 提交外部 Beta 审核 ─────────────────────────────
      # 上传后构建需几分钟处理成 VALID 才能送审，脚本内含轮询等待。
      # 非敏感的测试信息/联系人/演示账号集中在 ios/testflight-config.json，
      # 可随时改；改完下次发版自动带上。
      - name: 安装 Python 依赖(送审脚本)
        if: ${{ env.SUBMIT_REVIEW == 'true' }}
        run: pip3 install --quiet --break-system-packages pyjwt cryptography requests || pip3 install --quiet pyjwt cryptography requests

      - name: 等待构建处理完成并提交 Beta 审核
        if: ${{ env.SUBMIT_REVIEW == 'true' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          set -e
          # 还原 ASC API Key 文件供脚本使用
          echo "$ASC_API_KEY_BASE64" | base64 --decode > /tmp/asc_key.p8
          export ASC_P8_PATH=/tmp/asc_key.p8
          # 从 config 载入测试信息（脚本读 JSON 并输出 export TF_*，供 eval）
          eval "$(python3 scripts/tf-config-to-env.py)"
          # 轮询等待最新构建变 VALID（最多 ~18 分钟）
          python3 scripts/ios-testflight-submit.py

      # ── 可选：同一构建直接提交 App Store 正式版审核 ─────────────────────────
      # 只在 tag 触发且 ios/testflight-config.json 里 "submitAppStore": true 时运行；
      # 手动补交/演练用 ios-appstore-submit.yml（默认 dry-run）。
      # 脚本幂等：版本已建好/构建已挂/已在审核都会跳过；releaseType 沿用上一版本，不改发布方式。
      - name: 读取 App Store 自动送审开关
        id: appstore
        run: |
          ENABLED=$(python3 -c 'import json; print("true" if json.load(open("ios/testflight-config.json")).get("submitAppStore") is True else "false")')
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then ENABLED=false; fi
          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"
          echo "App Store 自动送审: $ENABLED"

      - name: 提交 App Store 审核
        if: ${{ steps.appstore.outputs.enabled == 'true' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          pip3 install --quiet --break-system-packages pyjwt cryptography || pip3 install --quiet pyjwt cryptography
          python3 -B scripts/test-ios-appstore-submit.py
          python3 scripts/ios-appstore-submit.py --version "$VERSION" --build-number "$BUILD_NUMBER" --config ios/testflight-config.json
