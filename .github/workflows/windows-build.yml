name: Windows Desktop Build

# 在云端 Windows runner 上用 electron-builder 打 Windows 安装包（NSIS .exe）。
# 无需本地/服务器装 wine。用法：Actions →「Windows Desktop Build」→ Run workflow，
# 跑完在底部 Artifacts 下载 touliao-windows-setup。
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish verified installer to production
        type: boolean
        default: false
      publish_verified_8129:
        description: 'User-approved exact 8.1.29 without Authenticode; retain Ed25519, hash, backup, and installed 8.1.27 upgrade validation'
        type: boolean
        default: false
      publish_verified_8127:
        description: 'Publish only the user-approved existing 8.1.27 artifact; retain Ed25519, backup, and old-client regression'
        type: boolean
        default: false
  push:
    tags:
      # 仅桌面端专属前缀触发；避免裸 v* 同时误触发 Android/iOS 发布（详见 VERSIONING.md）。
      - 'desktop-v*'

jobs:
  build:
    if: ${{ !inputs.publish_verified_8127 && !inputs.publish_verified_8129 }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Build web (desktop mode)
        working-directory: web
        run: npx vite build --mode desktop

      - name: Install desktop deps
        working-directory: desktop-electron
        run: npm ci

      - name: Update feedback and signature refusal regression
        run: node --test desktop-electron/scripts/update-feedback.test.cjs

      - name: Windows typography and day/night themes
        env:
          CHROMIUM_CHANNEL: chrome
        run: node scripts/windows-theme-smoke.cjs

      - name: Touliao icon states and light/dark gallery
        env:
          CHROMIUM_CHANNEL: chrome
          ICON_REVIEW_PLATFORMS: win32
          UI_OUTPUT: artifacts/windows-themes/icons
        run: node scripts/icon-visual-review.cjs

      - name: Upload Windows theme review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-theme-review
          path: artifacts/windows-themes
          if-no-files-found: warn

      - name: Require publisher credentials for production release
        if: startsWith(github.ref, 'refs/tags/desktop-v') || inputs.deploy == true
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) {
            throw 'Production publication requires WINDOWS_CERTIFICATE_BASE64. Ed25519 update signing is not Windows publisher signing.'
          }

      - name: 写入更新签名私钥（临时文件，用完即删）
        shell: bash
        run: echo "${{ secrets.UPDATE_PRIVATE_KEY }}" > "${{ runner.temp }}/update-private-key.pem"

      - name: Build Windows installer
        working-directory: desktop-electron
        # build:win 内部的 build:web 在 Windows cmd 里 cd 可能不生效；
        # web 已在上一步构建好，直接跑 electron-builder 即可。
        # afterPack 钩子会用 UPDATE_PRIVATE_KEY 校验+校验打包产物里的公钥；
        # 私钥缺失或不合法时这一步会直接失败，不会产出无签名的包。
        env:
          UPDATE_PRIVATE_KEY: ${{ runner.temp }}/update-private-key.pem
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          PUBLISH_RELEASE: ${{ startsWith(github.ref, 'refs/tags/desktop-v') || inputs.deploy == true }}
        run: |
          if ($env:PUBLISH_RELEASE -eq 'true') {
            npx electron-builder --win --x64 -c.forceCodeSigning=true
          } else {
            npx electron-builder --win --x64
          }

      - name: Verify trusted Windows publisher and timestamp
        if: startsWith(github.ref, 'refs/tags/desktop-v') || inputs.deploy == true
        working-directory: desktop-electron
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/touliao-*-setup.exe | Select-Object -First 1
          ./scripts/verify-authenticode.ps1 -Files @('dist/win-unpacked/touliao.exe', $installer.FullName)

      - name: 签名更新元数据 latest.yml
        working-directory: desktop-electron
        # 特意作为 electron-builder 进程退出后的独立步骤，不用 afterAllArtifactBuild 钩子——
        # 2026-08-30 实测发现该钩子与 electron-builder 自身写 latest.yml 的内部任务之间
        # 存在真实竞态（钩子触发时 yml 可能还没被最终内容覆盖完，事后又被重写导致签名失效）。
        # 独立步骤保证 electron-builder 进程已完全退出、yml 已是最终内容才签名。
        env:
          UPDATE_PRIVATE_KEY: ${{ runner.temp }}/update-private-key.pem
        run: node scripts/sign-update.js dist latest.yml

      - name: 清理私钥临时文件
        if: always()
        shell: bash
        run: rm -f "${{ runner.temp }}/update-private-key.pem"

      - name: Windows installed app multi-window regression
        working-directory: desktop-electron
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/touliao-*-setup.exe | Select-Object -First 1
          if (!$installer) { throw "Installer missing" }
          $installDir = Join-Path $env:RUNNER_TEMP 'touliao-installed'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $exe = Join-Path $installDir 'touliao.exe'
          if (!(Test-Path $exe)) { throw "Installed executable missing" }
          Get-Process touliao -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe } | Stop-Process -Force
          ./scripts/windows-shortcut-smoke.ps1 -Exe $exe
          $env:TOULIAO_ELECTRON = $exe
          $env:TOULIAO_PACKAGED_APP = '1'
          $env:TOULIAO_LOG_LEVEL = 'info'
          $env:DEBUG = 'pw:browser*'
          node scripts/multi-window-smoke.cjs
          if ($LASTEXITCODE -ne 0) {
            Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-10)} -ErrorAction SilentlyContinue | Where-Object { $_.ProviderName -in @('Application Error', 'Windows Error Reporting') } | Select-Object -First 10 -ExpandProperty Message
            exit 1
          }

      - name: Upload native update feedback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-update-feedback
          path: artifacts/windows-update-feedback
          if-no-files-found: warn

      - name: Upload installer + update feed
        uses: actions/upload-artifact@v4
        with:
          name: touliao-windows-setup
          # latest.yml / *.sig / *.blockmap 是 electron-updater 自动更新+Ed25519验签所必需：
          # 必须与 .exe 一并上传到更新源 https://touliao.cc/downloads/updates，
          # 否则客户端拉不到更新，或验签因缺 .sig 直接判 fail 被阻止安装。
          path: |
            desktop-electron/dist/*.exe
            desktop-electron/dist/latest.yml
            desktop-electron/dist/latest.yml.sig
            desktop-electron/dist/*.blockmap
            desktop-electron/release/*.exe
            desktop-electron/release/latest.yml
            desktop-electron/release/latest.yml.sig
            desktop-electron/release/*.blockmap
          # 改成 error（原为 warn）：afterPack 校验或签名步骤任何一步失败都应该让
          # 整个 workflow 在这里明显报错，而不是"产物没生成，但只显示一条容易被忽略的警告"。
          if-no-files-found: error

  deploy:
    name: 部署到新加坡服务器
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v') || inputs.deploy == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 2026-08-30 加固：此前没有 secret 检测，DEPLOY_SSH_KEY/DEPLOY_USER/DEPLOY_SERVER_HOST
      # 缺失时"SCP 到服务器"这一步会直接因 ssh 连接失败而报错（exit code 255），历史上
      # 已经实际发生过2次，构建本身成功但部署这一步标红——现状本身已经是"明确失败"，不是
      # 假绿灯，这里补一道更早、更清晰的检测，把"缺 secret"和"SSH真的连不上/网络问题"
      # 这两种不同原因的失败区分开，报错信息也更可操作。
      - name: 检查部署 secret 是否已配置
        run: |
          missing=()
          [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]     && missing+=("DEPLOY_SSH_KEY")
          [ -z "${{ secrets.DEPLOY_USER }}" ]        && missing+=("DEPLOY_USER")
          [ -z "${{ secrets.DEPLOY_SERVER_HOST }}" ] && missing+=("DEPLOY_SERVER_HOST")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::缺少部署所需的 secret：${missing[*]}。安装包已构建完成（见 build job 的 touliao-windows-setup Artifact，可手动下载），但无法自动部署到服务器——请到仓库 Settings → Secrets and variables → Actions 配置后重新触发本 workflow，或手动下载 Artifact 后按 deploy/README.md 的流程手动部署。"
            exit 1
          fi
          echo "✅ 部署所需 secret 齐全"

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: touliao-windows-setup
          path: artifacts

      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cp deploy/ssh_known_hosts ~/.ssh/known_hosts

      - name: SCP 到服务器
        run: |
          EXE=$(find artifacts -name "*.exe" | head -1)
          if [ -z "$EXE" ]; then
            echo "::error::在下载的 Artifact 里找不到 .exe 安装包"
            exit 1
          fi
          echo "部署: $EXE"
          # 2026-09-09 修复：此前写到 /var/www/touliao-downloads/，但那是旧机路径。
          # 当前这台("新机")nginx(touliao-cc.conf) 的 /downloads/ location 实际 alias
          # 到 /var/www/downloads/ ——旧路径这台机器上根本不存在，即使 DEPLOY_* secret
          # 配好了，文件也永远不会被真实提供服务(https://touliao.cc/downloads/... 会
          # 404，实测报过 "Cannot find channel latest.yml" 客户端更新失败)。android-release.yml
          # 2026-09-07 已经先改过同一个问题(见其 "新机 nginx alias" 注释)，这里跟上同一路径。
          # 直链文件名统一成 touliao-windows-latest.exe(不带 -setup 后缀)，与下载页命名一致。
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_SERVER_HOST }}" \
            "mkdir -p /var/www/downloads/updates"
          scp -i ~/.ssh/deploy_key "$EXE" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_SERVER_HOST }}:/var/www/downloads/.touliao-windows-latest.exe.pending"
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_SERVER_HOST }}" \
            "mv /var/www/downloads/.touliao-windows-latest.exe.pending /var/www/downloads/touliao-windows-latest.exe && cp /var/www/downloads/touliao-windows-latest.exe /var/www/downloads/.touliao-windows-latest-setup.exe.pending && mv /var/www/downloads/.touliao-windows-latest-setup.exe.pending /var/www/downloads/touliao-windows-latest-setup.exe"
          # 关键：把带版本名的 exe 也放进 updates/，electron-updater 读 latest.yml 后按原名去 updates/ 取，
          # 否则自动更新会 404（此前 updates/ 只有旧版 exe）。
          scp -i ~/.ssh/deploy_key "$EXE" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_SERVER_HOST }}:/var/www/downloads/updates/.$(basename "$EXE").pending"
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_SERVER_HOST }}" \
            "mv /var/www/downloads/updates/.$(basename "$EXE").pending /var/www/downloads/updates/$(basename "$EXE")"
          # 2026-08-30 修复：此前这里用 `find ... -name latest.yml -o -name '*.blockmap'`
          # 显式枚举文件名，2026-08-30当天新增的 latest.yml.sig 没被同步进这个枚举列表，
          # 直到今天 DEPLOY_SSH_KEY 第一次真正配好、这个 job 第一次真实跑通部署，
          # 才第一次暴露——build job(Upload installer + update feed步骤)已经打包了
          # latest.yml.sig，deploy job这边却没跟上，.sig 线上一直是404，自动更新一直
          # 会被验签正确拒绝。改成"下载到的产物里，除了.exe，其余全部同步"，不再枚举
          # 具体文件名——只要 build job 的 Upload 步骤 path 列表和这里保持"exe单独处理、
          # 其余都同步"这个约定，以后任何新增的元数据文件类型都不会被再次遗漏。
          # 去掉 `|| true`：任何一个文件同步失败都应该让这个 job 真实报红，不能被吞掉
          # 显示成绿色却其实没同步全。
          while IFS= read -r f; do
            echo "同步: $f"
            scp -i ~/.ssh/deploy_key "$f" \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_SERVER_HOST }}:/var/www/downloads/updates/.$(basename "$f").pending"
            ssh -n -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_SERVER_HOST }}" \
              "mv /var/www/downloads/updates/.$(basename "$f").pending /var/www/downloads/updates/$(basename "$f")"
          done < <(find artifacts -type f ! -name "*.exe" ! -name latest.yml; find artifacts -type f -name latest.yml)
          echo "✅ SCP 全部完成"

      - name: 部署后真实验证（curl 逐个确认线上真的能拿到，不只信上面的日志）
        run: |
          EXE=$(find artifacts -name "*.exe" | head -1)
          EXE_NAME=$(basename "$EXE")
          BASE="https://touliao.cc/downloads"
          fail=0
          received=$(mktemp)
          trap 'rm -f "$received"' EXIT
          check() {
            local url="$1"
            local expected="$2"
            if curl --fail --silent --show-error --max-time 180 "$url" -o "$received" && cmp -s "$expected" "$received"; then
              echo "Verified published bytes: $url"
            else
              echo "::error::Published file is missing or differs from the verified artifact: $url"
              fail=1
            fi
          }
          check "$BASE/updates/latest.yml" "$(find artifacts -name latest.yml | head -1)"
          check "$BASE/updates/latest.yml.sig" "$(find artifacts -name latest.yml.sig | head -1)"
          check "$BASE/updates/$EXE_NAME" "$EXE"
          check "$BASE/updates/$EXE_NAME.blockmap" "$(find artifacts -name "$EXE_NAME.blockmap" | head -1)"
          check "$BASE/touliao-windows-latest.exe" "$EXE"
          check "$BASE/touliao-windows-latest-setup.exe" "$EXE"
          if [ "$fail" -ne 0 ]; then
            echo "::error::部署后验证失败，至少一个文件线上不可访问，自动更新链路不完整"
            exit 1
          fi
          echo "✅ 部署后验证全部通过：latest.yml / latest.yml.sig / 版本化安装包 / 直链安装包 均可正常访问"
          echo "✅ 已发布到 https://touliao.cc/downloads/touliao-windows-latest.exe"

  publish-existing-8127:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_verified_8127 && !inputs.publish_verified_8129 && !inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify publication transaction and rollback guards
        run: python3 -B scripts/test-windows-downloads.py -v
      - name: Download the exact previously validated user-approved installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view 35412981635 --repo "$GITHUB_REPOSITORY" --json headSha,conclusion > candidate-build.json
          node -e 'const x=require("./candidate-build.json"); if(x.headSha!=="e764f3969fe84f9577883e790ebae7e85ce6210c"||x.conclusion!=="success")process.exit(1)'
          gh run download 35412981635 --repo "$GITHUB_REPOSITORY" --name touliao-windows-setup --dir candidate
          node scripts/verify-windows-8127.cjs candidate/dist
      - name: Publish exact 8.1.27 using the existing signed update protocol
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_SERVER_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash scripts/publish-windows-8127.sh publish candidate/dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-8127-publication
          path: windows-publication-evidence/
          if-no-files-found: warn

  verify-existing-8127:
    needs: publish-existing-8127
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install actual historical 8.1.26
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'old-8.1.26.exe'
          Invoke-WebRequest https://touliao.cc/downloads/updates/touliao-8.1.26-setup.exe -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash.ToLower() -ne '3933d478dc6dd8c4ffb9863abc84c4a4635c8913bfe3a70fd537b1626b4c5c46') { throw 'Historical installer changed' }
          $directory = Join-Path $env:RUNNER_TEMP 'TouliaoLegacy'
          $p = Start-Process $setup -ArgumentList @('/S', '/currentuser', "/D=$directory") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Historical installation failed' }
          Get-Process touliao -ErrorAction SilentlyContinue | Stop-Process -Force
          "LEGACY_EXE=$(Join-Path $directory 'touliao.exe')" >> $env:GITHUB_ENV
          "PLAYWRIGHT_MODULE=$env:RUNNER_TEMP/legacy-driver/node_modules/playwright" >> $env:GITHUB_ENV
          npm install --prefix "$env:RUNNER_TEMP/legacy-driver" --no-audit --no-fund playwright@1.60.0
      - name: Discover download verify and apply through the installed old updater
        run: node scripts/legacy-update/windows-auto-upgrade.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-8127-actual-auto-upgrade
          path: windows-auto-evidence/
          if-no-files-found: error

  rollback-existing-8127:
    needs: [publish-existing-8127, verify-existing-8127]
    if: always() && needs.publish-existing-8127.result == 'success' && needs.verify-existing-8127.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restore saved Windows pointers if installed-client validation fails
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_SERVER_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash scripts/publish-windows-8127.sh rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-8127-rollback
          path: windows-publication-evidence/

  publish-existing-8129:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_verified_8129 && !inputs.publish_verified_8127 && !inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify publication transaction and rollback guards
        run: python3 -B scripts/test-windows-downloads.py -v
      - name: Download the exact previously validated user-approved installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view 35464783766 --repo "$GITHUB_REPOSITORY" --json headSha,conclusion > candidate-build.json
          node -e 'const x=require("./candidate-build.json"); if(x.headSha!=="08c6734506a7b9766995979aff4c566dae64bc67"||x.conclusion!=="success")process.exit(1)'
          gh run download 35464783766 --repo "$GITHUB_REPOSITORY" --name touliao-windows-setup --dir candidate
          node scripts/verify-windows-8127.cjs candidate/dist 8129
      - name: Publish exact 8.1.29 using the existing signed update protocol
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_SERVER_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash scripts/publish-windows-8127.sh publish candidate/dist 8129
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-8129-publication
          path: windows-publication-evidence/
          if-no-files-found: warn

  verify-existing-8129:
    needs: publish-existing-8129
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install actual historical 8.1.27
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'old-8.1.27.exe'
          Invoke-WebRequest https://touliao.cc/downloads/updates/touliao-8.1.27-setup.exe -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash.ToLower() -ne 'c2ae64ec1316d5f033b9f2afa25b3eb5bfbf56f978d8abe99b20b21c2cbcf7e0') { throw 'Historical installer changed' }
          $directory = Join-Path $env:RUNNER_TEMP 'TouliaoLegacy'
          $p = Start-Process $setup -ArgumentList @('/S', '/currentuser', "/D=$directory") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Historical installation failed' }
          Get-Process touliao -ErrorAction SilentlyContinue | Stop-Process -Force
          "LEGACY_EXE=$(Join-Path $directory 'touliao.exe')" >> $env:GITHUB_ENV
          "PLAYWRIGHT_MODULE=$env:RUNNER_TEMP/legacy-driver/node_modules/playwright" >> $env:GITHUB_ENV
          npm install --prefix "$env:RUNNER_TEMP/legacy-driver" --no-audit --no-fund playwright@1.60.0
      - name: Discover download verify and apply through the installed old updater
        env:
          WINDOWS_UPDATE_APPROVAL: '8129'
        run: node scripts/legacy-update/windows-auto-upgrade.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-8129-actual-auto-upgrade
          path: windows-auto-evidence/
          if-no-files-found: error

  rollback-existing-8129:
    needs: [publish-existing-8129, verify-existing-8129]
    if: always() && needs.publish-existing-8129.result == 'success' && needs.verify-existing-8129.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
