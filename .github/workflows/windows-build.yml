name: Windows Desktop Build

# 在云端 Windows runner 上用 electron-builder 打 Windows 安装包（NSIS .exe）。
# 无需本地/服务器装 wine。用法：Actions →「Windows Desktop Build」→ Run workflow，
# 跑完在底部 Artifacts 下载 touliao-windows-setup。
on:
  workflow_dispatch:
  push:
    tags:
      # 仅桌面端专属前缀触发；避免裸 v* 同时误触发 Android/iOS 发布（详见 VERSIONING.md）。
      - 'desktop-v*'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Build web (desktop mode)
        working-directory: web
        run: npx vite build --mode desktop

      - name: Install desktop deps
        working-directory: desktop-electron
        run: npm ci

      - name: 写入更新签名私钥（临时文件，用完即删）
        shell: bash
        run: echo "${{ secrets.UPDATE_PRIVATE_KEY }}" > "${{ runner.temp }}/update-private-key.pem"

      - name: Build Windows installer
        working-directory: desktop-electron
        # build:win 内部的 build:web 在 Windows cmd 里 cd 可能不生效；
        # web 已在上一步构建好，直接跑 electron-builder 即可。
        # afterPack 钩子会用 UPDATE_PRIVATE_KEY 校验+校验打包产物里的公钥；
        # 私钥缺失或不合法时这一步会直接失败，不会产出无签名的包。
        env:
          UPDATE_PRIVATE_KEY: ${{ runner.temp }}/update-private-key.pem
        run: npx electron-builder --win --x64

      - name: 签名更新元数据 latest.yml
        working-directory: desktop-electron
        # 特意作为 electron-builder 进程退出后的独立步骤，不用 afterAllArtifactBuild 钩子——
        # 2026-08-30 实测发现该钩子与 electron-builder 自身写 latest.yml 的内部任务之间
        # 存在真实竞态（钩子触发时 yml 可能还没被最终内容覆盖完，事后又被重写导致签名失效）。
        # 独立步骤保证 electron-builder 进程已完全退出、yml 已是最终内容才签名。
        env:
          UPDATE_PRIVATE_KEY: ${{ runner.temp }}/update-private-key.pem
        run: node scripts/sign-update.js dist latest.yml

      - name: 清理私钥临时文件
        if: always()
        shell: bash
        run: rm -f "${{ runner.temp }}/update-private-key.pem"

      - name: Upload installer + update feed
        uses: actions/upload-artifact@v4
        with:
          name: touliao-windows-setup
          # latest.yml / *.sig / *.blockmap 是 electron-updater 自动更新+Ed25519验签所必需：
          # 必须与 .exe 一并上传到更新源 https://touliao.cc/downloads/updates，
          # 否则客户端拉不到更新，或验签因缺 .sig 直接判 fail 被阻止安装。
          path: |
            desktop-electron/dist/*.exe
            desktop-electron/dist/latest.yml
            desktop-electron/dist/latest.yml.sig
            desktop-electron/dist/*.blockmap
            desktop-electron/release/*.exe
            desktop-electron/release/latest.yml
            desktop-electron/release/latest.yml.sig
            desktop-electron/release/*.blockmap
          # 改成 error（原为 warn）：afterPack 校验或签名步骤任何一步失败都应该让
          # 整个 workflow 在这里明显报错，而不是"产物没生成，但只显示一条容易被忽略的警告"。
          if-no-files-found: error

  deploy:
    name: 部署到香港服务器
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 2026-08-30 加固：此前没有 secret 检测，DEPLOY_SSH_KEY/DEPLOY_USER/DEPLOY_SERVER_HOST
      # 缺失时"SCP 到服务器"这一步会直接因 ssh 连接失败而报错（exit code 255），历史上
      # 已经实际发生过2次，构建本身成功但部署这一步标红——现状本身已经是"明确失败"，不是
      # 假绿灯，这里补一道更早、更清晰的检测，把"缺 secret"和"SSH真的连不上/网络问题"
      # 这两种不同原因的失败区分开，报错信息也更可操作。
      - name: 检查部署 secret 是否已配置
        run: |
          missing=()
          [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]     && missing+=("DEPLOY_SSH_KEY")
          [ -z "${{ secrets.DEPLOY_USER }}" ]        && missing+=("DEPLOY_USER")
          [ -z "${{ secrets.DEPLOY_SERVER_HOST }}" ] && missing+=("DEPLOY_SERVER_HOST")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::缺少部署所需的 secret：${missing[*]}。安装包已构建完成（见 build job 的 touliao-windows-setup Artifact，可手动下载），但无法自动部署到服务器——请到仓库 Settings → Secrets and variables → Actions 配置后重新触发本 workflow，或手动下载 Artifact 后按 deploy/README.md 的流程手动部署。"
            exit 1
          fi
          echo "✅ 部署所需 secret 齐全"

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: touliao-windows-setup
          path: artifacts

      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: SCP 到服务器
        run: |
          EXE=$(find artifacts -name "*.exe" | head -1)
          if [ -z "$EXE" ]; then
            echo "::error::在下载的 Artifact 里找不到 .exe 安装包"
            exit 1
          fi
          echo "部署: $EXE"
          # 2026-08-29 修复：此前一直写到 /var/www/downloads/，但 nginx(touliao-cc.conf)
          # 的 /downloads/ location 实际 alias 到 /var/www/touliao-downloads/ ——
          # 前者这台服务器上根本不存在，即使 DEPLOY_* secret 配好了，文件也永远不会被真实
          # 提供服务(https://touliao.cc/downloads/... 会 404)。同时把直链文件名统一成
          # touliao-windows-latest.exe(不带 -setup 后缀)，与已在用的下载页命名一致。
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_SERVER_HOST }}" \
            "mkdir -p /var/www/touliao-downloads/updates"
          scp -i ~/.ssh/deploy_key "$EXE" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_SERVER_HOST }}:/var/www/touliao-downloads/touliao-windows-latest.exe"
          # 关键：把带版本名的 exe 也放进 updates/，electron-updater 读 latest.yml 后按原名去 updates/ 取，
          # 否则自动更新会 404（此前 updates/ 只有旧版 exe）。
          scp -i ~/.ssh/deploy_key "$EXE" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_SERVER_HOST }}:/var/www/touliao-downloads/updates/$(basename "$EXE")"
          # 2026-08-30 修复：此前这里用 `find ... -name latest.yml -o -name '*.blockmap'`
          # 显式枚举文件名，2026-08-30当天新增的 latest.yml.sig 没被同步进这个枚举列表，
          # 直到今天 DEPLOY_SSH_KEY 第一次真正配好、这个 job 第一次真实跑通部署，
          # 才第一次暴露——build job(Upload installer + update feed步骤)已经打包了
          # latest.yml.sig，deploy job这边却没跟上，.sig 线上一直是404，自动更新一直
          # 会被验签正确拒绝。改成"下载到的产物里，除了.exe，其余全部同步"，不再枚举
          # 具体文件名——只要 build job 的 Upload 步骤 path 列表和这里保持"exe单独处理、
          # 其余都同步"这个约定，以后任何新增的元数据文件类型都不会被再次遗漏。
          # 去掉 `|| true`：任何一个文件同步失败都应该让这个 job 真实报红，不能被吞掉
          # 显示成绿色却其实没同步全。
          while IFS= read -r f; do
            echo "同步: $f"
            scp -i ~/.ssh/deploy_key "$f" \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_SERVER_HOST }}:/var/www/touliao-downloads/updates/"
          done < <(find artifacts -type f ! -name "*.exe")
          echo "✅ SCP 全部完成"

      - name: 部署后真实验证（curl 逐个确认线上真的能拿到，不只信上面的日志）
        run: |
          EXE=$(find artifacts -name "*.exe" | head -1)
          EXE_NAME=$(basename "$EXE")
          BASE="https://touliao.cc/downloads"
          fail=0
          check() {
            local url="$1"
            local code
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            if [ "$code" = "200" ]; then
              echo "✅ $url → HTTP $code"
            else
              echo "::error::$url → HTTP $code（期望200）"
              fail=1
            fi
          }
          check "$BASE/updates/latest.yml"
          check "$BASE/updates/latest.yml.sig"
          check "$BASE/updates/$EXE_NAME"           # electron-updater 真正会去拉的版本化安装包
          check "$BASE/touliao-windows-latest.exe"  # 人工直接下载用的固定直链
          if [ "$fail" -ne 0 ]; then
            echo "::error::部署后验证失败，至少一个文件线上不可访问，自动更新链路不完整"
            exit 1
          fi
          echo "✅ 部署后验证全部通过：latest.yml / latest.yml.sig / 版本化安装包 / 直链安装包 均可正常访问"
          echo "✅ 已发布到 https://touliao.cc/downloads/touliao-windows-latest.exe"
