name: Encrypted Credential Escrow
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: touliao-credential-escrow
  cancel-in-progress: false
jobs:
  escrow:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install encryption tool
        run: sudo apt-get update -qq && sudo apt-get install -y age
      - name: Encrypt credentials without creating a plaintext archive
        env:
          ESCROW_ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ESCROW_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ESCROW_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ESCROW_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ESCROW_ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ESCROW_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ESCROW_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ESCROW_DEPLOY_SERVER_HOST: ${{ secrets.DEPLOY_SERVER_HOST }}
          ESCROW_DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          ESCROW_DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          ESCROW_GETUI_APP_ID: ${{ secrets.GETUI_APP_ID }}
          ESCROW_GETUI_APP_KEY: ${{ secrets.GETUI_APP_KEY }}
          ESCROW_GETUI_APP_SECRET: ${{ secrets.GETUI_APP_SECRET }}
          ESCROW_IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          ESCROW_IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          ESCROW_IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          ESCROW_IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ESCROW_UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
          ESCROW_WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          ESCROW_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: node deploy/credential-escrow.cjs seal "$RUNNER_TEMP/ci-credentials.age" deploy/backup-age-recipient.txt desktop-electron/src/update-public-key.pem
      - name: Transfer ciphertext to private backup staging
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_SERVER_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy-key"
          cp deploy/ssh_known_hosts ~/.ssh/known_hosts
          scp -i "$RUNNER_TEMP/deploy-key" "$RUNNER_TEMP/ci-credentials.age" "$DEPLOY_USER@$DEPLOY_HOST:/home/ubuntu/.touliao-migration/ci-credentials.age.pending"
          ssh -n -i "$RUNNER_TEMP/deploy-key" -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" 'chmod 600 /home/ubuntu/.touliao-migration/ci-credentials.age.pending && mv /home/ubuntu/.touliao-migration/ci-credentials.age.pending /home/ubuntu/.touliao-migration/ci-credentials.age'
      - name: Remove temporary files
        if: always()
        run: rm -f "$RUNNER_TEMP/ci-credentials.age" "$RUNNER_TEMP/deploy-key"
