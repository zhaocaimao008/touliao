<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="build-time" content="2026-08-12T00:00:00Z" />

    <!-- DNS 预解析和预连接（减少 API 请求延迟） -->
    <link rel="dns-prefetch" href="//api.touliao.app" />
    <link rel="preconnect" href="//api.touliao.app" crossorigin />

    <!-- 预加载关键资源 -->
    <link rel="modulepreload" href="/src/main.jsx" />

    <title>投聊</title>
    <meta name="description" content="投聊 - 极致体验的即时通讯应用" />
    <link rel="manifest" href="/manifest.json" />

    <!-- PWA 相关 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="投聊" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif; }
      /* 首屏/更新后 JS 解析期间的加载占位，避免白屏（React 挂载到 #root 后自动被替换消失）*/
      #app-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #1A2033;
      }
      #app-splash .spin {
        width: 34px; height: 34px; border-radius: 50%;
        border: 3px solid rgba(255,255,255,.15);
        border-top-color: #8A78EB;
        animation: appspin .8s linear infinite;
      }
      @keyframes appspin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash"><div class="spin"></div></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
