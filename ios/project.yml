name: Touliao
options:
  bundleIdPrefix: com.touliao
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: "16.1.0"
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    from: "7.10.0"
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.4.0"
  WebRTC:
    url: https://github.com/stasel/WebRTC
    from: "125.0.0"

targets:
  Touliao:
    type: application
    platform: iOS
    sources:
      - Touliao
    dependencies:
      - package: SocketIO
      - package: Kingfisher
      - package: Firebase
        product: FirebaseMessaging
      - package: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.touliao.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 2026-08-30 说明：这两个值只在 CI 编译门禁(ios-build.yml 的模拟器构建，不覆盖
        # 这两个字段)和本地 Xcode 开发构建里生效——真正发布到 TestFlight 的版本号/build号
        # 由 ios-testflight.yml 在归档时用 MARKETING_VERSION="$APP_VERSION"/
        # CURRENT_PROJECT_VERSION="$BUILD_NUMBER" 显式覆盖（版本号取自触发时的 tag 或
        # workflow_dispatch 的 version 输入，build号取构建时刻的时间戳），不读这里的值。
        # 改这里不会改变实际发布版本号；保留只是为了让 CI门禁/本地构建显示的版本号不要
        # 跟真实发布版本线差太远，避免混淆——之前这里长期停在"8.0.0"没跟着真实版本走，
        # 而实际发布过的版本号是分别在触发时传参决定的（见 AUDIT.md）。
        MARKETING_VERSION: "8.1.0"
        CURRENT_PROJECT_VERSION: "33"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        # 发布签名只挂在 App 主 target，避免命令行全局传参把描述文件
        # 套用到 SPM 依赖(Firebase/Kingfisher 等)而报 "does not support
        # provisioning profiles"。CI 归档不再传 PROVISIONING_PROFILE_SPECIFIER。
        # 模拟器构建走 CODE_SIGNING_ALLOWED=NO，不受影响。
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: F2J52VX786
        CODE_SIGN_IDENTITY: "iPhone Distribution"
        PROVISIONING_PROFILE_SPECIFIER: touliao_distribution
        # 推送权限：签名时带上 aps-environment，否则 registerForRemoteNotifications
        # 拿不到 APNs token → FCM 无法送达（iOS 锁屏收不到通知的根因）。
        CODE_SIGN_ENTITLEMENTS: Touliao/Touliao.entitlements
    info:
      path: Touliao/Info.plist
      properties:
        CFBundleDisplayName: 投聊
        # 必须显式引用 build settings，否则 XcodeGen 默认把 CFBundleVersion
        # 写死为 "1"，命令行传的时间戳 build 号(CURRENT_PROJECT_VERSION)不生效，
        # 导致 TestFlight 报 "bundle version must be higher than '1'"。
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        # 启动画面：已按要求移除品牌图/背景（保留空 UILaunchScreen，iOS 用系统默认纯色启动）
        UILaunchScreen: {}
        # 出口合规：仅用标准 HTTPS/系统加密(属豁免)，声明后每次上传免手动回答，
        # 且构建可直接对外分发（否则 TestFlight 外部测试会卡在“合规未回答”）。
        ITSAppUsesNonExemptEncryption: false
        # 关键修复：禁用 Firebase swizzling（firebase-ios-sdk#14751：
        # SPM 集成 Firebase + FirebaseApp.configure() 会吞掉 didRegister/didFail
        # APNs 回调 → 锁屏无通知）。禁用它让系统直接回调我们的 AppDelegate。
        FirebaseAppDelegateProxyEnabled: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 后台收推送（远程通知；voip 已移除——PushKit VoIP capability 已从 App ID 移除，避免 Guideline 2.5.4 审核风险）
        UIBackgroundModes:
          - remote-notification
        # 录音 / 相册 用途说明（聊天媒体阶段需要）
        NSMicrophoneUsageDescription: 用于录制语音消息与音视频通话
        NSPhotoLibraryUsageDescription: 用于发送图片
        NSPhotoLibraryAddUsageDescription: 用于保存聊天图片到相册
        NSCameraUsageDescription: 用于扫码添加好友与视频通话
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false

  TouliaoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TouliaoTests
    dependencies:
      - target: Touliao
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.touliao.app.tests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: true

# 显式声明 Touliao scheme 的 test 动作挂上 TouliaoTests，
# 保证 CI 里 `xcodebuild test -scheme Touliao -only-testing:TouliaoTests` 可用。
schemes:
  Touliao:
    build:
      targets:
        Touliao: all
        TouliaoTests: [test]
    test:
      targets:
        - TouliaoTests
      gatherCoverageData: false
