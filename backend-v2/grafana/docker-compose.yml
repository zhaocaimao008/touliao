version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: vxin-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - vxin-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: vxin-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # 生产环境请在 .env 中设置 GRAFANA_ADMIN_PASSWORD，覆盖下方强随机默认值。
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-T0uL1ao-Gf_9x7Q!4m2Z#8Kp}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./vxin-dashboard.json:/etc/grafana/provisioning/dashboards/vxin-dashboard.json:ro
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
    depends_on:
      - prometheus
    networks:
      - vxin-network
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:

networks:
  vxin-network:
    driver: bridge
