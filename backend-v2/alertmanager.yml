# AlertManager 配置
global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'alerts@dipsin.com'
  smtp_auth_username: 'alerts@dipsin.com'
  smtp_auth_password: 'your-password'

# 告警路由
route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'default'
  routes:
    # 严重告警立即通知
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 0s
      repeat_interval: 5m
    
    # 警告级别告警
    - match:
        severity: warning
      receiver: 'warning-alerts'
      repeat_interval: 30m

# 接收器配置
receivers:
  # 默认接收器
  - name: 'default'
    webhook_configs:
      - url: 'http://localhost:3002/api/alerts/webhook'
        send_resolved: true

  # 严重告警接收器
  - name: 'critical-alerts'
    email_configs:
      - to: 'admin@dipsin.com'
        headers:
          Subject: '🚨 v信严重告警：{{ .GroupLabels.alertname }}'
    webhook_configs:
      - url: 'http://localhost:3002/api/alerts/webhook'
        send_resolved: true
    # 可选：配置短信通知
    # webhook_configs:
    #   - url: 'https://sms-api.example.com/send'

  # 警告告警接收器
  - name: 'warning-alerts'
    email_configs:
      - to: 'dev@dipsin.com'
        headers:
          Subject: '⚠️ v信警告：{{ .GroupLabels.alertname }}'

# 抑制规则
inhibit_rules:
  # 如果服务宕机，抑制其他相关告警
  - source_match:
      severity: 'critical'
      alertname: 'ServiceDown'
    target_match:
      severity: 'warning'
    equal: ['instance']
