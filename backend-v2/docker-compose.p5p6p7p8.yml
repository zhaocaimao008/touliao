# P5-P8 优化 - Docker Compose 完整栈

version: '3.9'

services:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # P5: PostgreSQL 数据库 (主从复制)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  postgres-primary:
    image: postgres:14-alpine
    container_name: vxin-db-primary
    environment:
      POSTGRES_DB: vxin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "-c wal_level=replica -c max_wal_senders=10"
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - vxin-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-replica:
    image: postgres:14-alpine
    container_name: vxin-db-replica
    environment:
      PGUSER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    depends_on:
      postgres-primary:
        condition: service_healthy
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    command: |
      bash -c "
        pg_basebackup -h postgres-primary -D /var/lib/postgresql/data -U postgres -v -P -W &&
        echo 'standby_mode = on' >> /var/lib/postgresql/data/recovery.conf &&
        postgres
      "
    networks:
      - vxin-network

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # P6: 加密密钥管理服务
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  vault:
    image: vault:latest
    container_name: vxin-vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "dev-token-12345"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    volumes:
      - vault_data:/vault/data
    command: vault server -dev -dev-root-token-id=dev-token-12345
    networks:
      - vxin-network

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # P7: 微服务 - User Service
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: vxin-user-service
    environment:
      SERVICE_NAME: user-service
      DB_HOST: postgres-primary
      DB_PORT: 5432
      VAULT_ADDR: http://vault:8200
    depends_on:
      postgres-primary:
        condition: service_healthy
    ports:
      - "3001:3001"
    networks:
      - vxin-network

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # P7: 微服务 - Message Service
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  message-service:
    build:
      context: ./services/message-service
      dockerfile: Dockerfile
    container_name: vxin-message-service
    environment:
      SERVICE_NAME: message-service
      DB_HOST: postgres-primary
      KAFKA_BROKERS: kafka:9092
    depends_on:
      - postgres-primary
      - kafka
    ports:
      - "3002:3002"
    networks:
      - vxin-network

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # P7: 消息队列 (Kafka)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: vxin-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - vxin-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: vxin-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks:
      - vxin-network

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # P7: API Gateway
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: vxin-api-gateway
    environment:
      GATEWAY_PORT: 3000
      USER_SERVICE_URL: http://user-service:3001
      MESSAGE_SERVICE_URL: http://message-service:3002
      SOCIAL_SERVICE_URL: http://social-service:3003
    depends_on:
      - user-service
      - message-service
    ports:
      - "3000:3000"
    networks:
      - vxin-network

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 监控与可观测性
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  prometheus:
    image: prom/prometheus:latest
    container_name: vxin-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - vxin-network

  grafana:
    image: grafana/grafana:latest
    container_name: vxin-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - vxin-network

volumes:
  postgres_primary_data:
  postgres_replica_data:
  vault_data:
  prometheus_data:

networks:
  vxin-network:
    driver: bridge
