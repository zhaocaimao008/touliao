# ⚠️ 这是线上 nginx 配置 /etc/nginx/sites-enabled/touliao-cc.conf 的副本，仅供参考和
# 灾难恢复用（比如服务器重装后，照这份文件重建配置）——**不会自动同步**，只是
# 手动复制进来的一份快照。修改线上配置后，需要手动把改动同步过来
# 再提交，两份文件是否一致完全靠人工纪律维持，见 deploy/README.md
# "nginx 配置纳入版本控制"一节的完整流程说明。
#
# 上次同步：2026-09-27（关闭 /downloads/ 目录列表）。
# 2026-10-12 待上线改动（见 deploy/APPLY-20261012.md，上线前这份 ≠ 线上）：
#   - 443 server 加 ssl_session_cache/ssl_session_timeout
#   - 后端改走 upstream touliao_backend（keepalive 连接复用）
#   - socket.io 的 Connection 头改用 map（升级请求发 upgrade，轮询请求可复用 keepalive）
#   - 新增 internal 的 /_protected_uploads/（后端 UPLOADS_X_ACCEL=1 时用 X-Accel-Redirect 交给 nginx 发文件）
# 仓库先行、尚未同步到线上：2026-10-12 加的 log_format touliao_sw 与 location = /sw.js
# （退役版 Service Worker 单独记日志，用来判断何时可删，见 web/public/sw.js 文件头）。
# 同步方法：整段照抄到线上文件，sudo nginx -t 通过后 sudo nginx -s reload，再改上面的日期。
#
# 敏感信息审查（2026-08-30）：全文没有硬编码密码/密钥/token。出现的"敏感看起来的"
# 内容逐项说明，均判定不需要脱敏：
#   - ssl_certificate / ssl_certificate_key：只是 Let's Encrypt 标准路径
#     （/etc/letsencrypt/live/touliao.cc/...），不是证书或私钥内容本身，路径公开
#     不构成风险，且必须是真实路径 nginx 才能启动
#   - 反代到 127.0.0.1:3003 / :8790：均为本机 localhost 回环端口，外部
#     网络不可达，不是可被利用的凭证
#   - server_name touliao.cc / www.touliao.cc：公开域名本身
# 如果以后这份配置里出现了真正的密钥/密码（不应该出现，nginx配置本来就不该放这些），
# 再单独脱敏处理，不要往这个文件里加真实密钥。

# http context: no query strings, Referer or Authorization in access logs.
log_format touliao_redacted '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
# /sw.js only: also records the Service-Worker request header ("script" when a browser fetches
# a service worker script), so registration update checks can be told apart from probes/crawlers.
log_format touliao_sw '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent sw=$http_service_worker';

# ── 后端 upstream（http 级，名字全局唯一：同机还有 vxin/newchat/bailongma 等站点，
#    2026-10-12 核对 sites-enabled/conf.d 均无 upstream 定义，加 touliao_ 前缀防撞名）──
upstream touliao_backend {
    server 127.0.0.1:3003;
    keepalive 32;
    # Node 22 http.Server 默认 keepAliveTimeout=5s。nginx 侧空闲超时必须比它短，
    # 否则 Node 先关连接、nginx 恰好复用 → 偶发 502（POST 不会自动重试）。
    # 若后端把 server.keepAliveTimeout 调到 65s，这里可以放宽到 60s。
    keepalive_timeout 4s;
    keepalive_requests 1000;
}

# WebSocket 升级：有 Upgrade 头 → "upgrade"；没有（socket.io 长轮询）→ 空串，
# 空串 = 不发 Connection 头，配合 proxy_http_version 1.1 可复用 keepalive 连接。
# map 变量同样全局，带 touliao_ 前缀（线上已有 $blm_ok/$qqdesk_auth_key 等，无冲突）。
map $http_upgrade $touliao_connection_upgrade {
    default upgrade;
    ''      '';
}

# 投聊 touliao.cc — HTTP → HTTPS
server {
    access_log /var/log/nginx/touliao-access.log touliao_redacted;
    listen 80;
    listen [::]:80;
    server_name touliao.cc www.touliao.cc;

    # ACME HTTP-01 验证 (证书续期用, 必须留在 80)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/touliao-web;
        default_type text/plain;
    }

    location / { return 301 https://$host$request_uri; }
}

# 投聊 touliao.cc — HTTPS 主站
server {
    access_log /var/log/nginx/touliao-access.log touliao_redacted;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name touliao.cc www.touliao.cc;

    ssl_certificate     /etc/letsencrypt/live/touliao.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/touliao.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # TLS 会话复用。没 include certbot 的 options-ssl-nginx.conf：它会再写一遍
    # ssl_protocols / ssl_prefer_server_ciphers / ssl_ciphers，和上面重复会 nginx -t 报 duplicate。
    # 用独立 zone 名（certbot 那份是 le_nginx_SSL:10m，同名不同大小会冲突）。
    # ssl_session_tickets 保持默认 on：0.0.0.0:443 上本 server 不是默认 server（默认是
    # ai-auth.conf），OpenSSL 在 SNI 切换前就按默认 server 的上下文处理会话/票据，
    # 2026-10-12 实测 TLS1.2/1.3 已经能靠票据复用；在这里关票据收益不确定、反而可能丢复用。
    ssl_session_cache shared:touliao_ssl:20m;
    ssl_session_timeout 1d;

    root /var/www/touliao-web;
    index index.html;
    client_max_body_size 200m;

    # 静态资源压缩：全局只有 gzip on，gzip_types 默认仅 text/html，JS/CSS 原样传输
    # （首屏 ~560KB → ~190KB）。优先发 vite 构建产出的 .gz 预压缩文件，缺失时现场压缩。
    # 反代到后端的响应不受影响（gzip_proxied 默认 off，后端 compression 中间件自己压）。
    # brotli 见 deploy/nginx/conf.d/touliao-brotli.conf（需先装模块，可选）。
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        # HTML、Service Worker 和未带内容哈希的前端资源每次使用前重验证。
        add_header Cache-Control 'no-cache, max-age=0, must-revalidate' always;
        include snippets/touliao-security-headers.conf;
    }

    # 退役版 Service Worker（web/public/sw.js）：老浏览器根作用域注册的更新检查靠它清理并注销。
    # 头部同 location /；文件缺失时直接 404，不让 .js 路径回落成 index.html。
    # 另记一份带 Service-Worker 请求头的日志，用来判断何时可以删（见 sw.js 文件头）。
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control 'no-cache, max-age=0, must-revalidate' always;
        include snippets/touliao-security-headers.conf;
        access_log /var/log/nginx/touliao-access.log touliao_redacted;
        access_log /var/log/nginx/touliao-sw.log touliao_sw;
    }

    # Vite 内容哈希资源可长期缓存；旧 chunk 保留供已打开的页面使用。
    location ~ "^/assets/.+-[A-Za-z0-9_-]{8}\.(js|mjs|css|woff2?|png|webp|svg)$" {
        try_files $uri =404;
        add_header Cache-Control 'public, max-age=31536000, immutable';
    }

    # 运行时配置（no-cache）——四端启动时读这个决定连哪个后端，
    # 换服务器只改这个文件内容，无需重新编译/发版。
    location = /config.json {
        alias /var/www/touliao-runtime-config/config.json;
        add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
        add_header Content-Type application/json always;
    }

    # 企业代码目录：多客户独立部署共用同一个 App 时，「代码 → 客户自己
    # 的服务器地址」查找表。与 config.json 同样独立存放、同样 no-cache。
    location = /directory.json {
        alias /var/www/touliao-runtime-config/directory.json;
        add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
        add_header Content-Type application/json always;
    }

    # ── 后台管理面板（静态，不走 SPA 回落）──
    # 2026-09-14 补：此前线上缺这段 + /var/www/touliao-admin/ 目录不存在，
    # /admin/ 落到上面的 SPA fallback 显示前端页面。目录由 deploy.yml 步骤 2a-2 发布。
    location = /admin {
        return 301 /admin/;
    }
    location ^~ /admin/ {
        alias /var/www/touliao-admin/;
        index index.html;
        add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
        include snippets/touliao-security-headers.conf;
    }

    # API 反代到后端
    location = /health {
        proxy_pass http://touliao_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        add_header Cache-Control 'no-store' always;
    }

    location /api/ {
        proxy_pass http://touliao_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    # Socket.io 实时（WebSocket 升级 + 长轮询共用）
    location /socket.io/ {
        proxy_pass http://touliao_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $touliao_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600s;
    }

    # 后端本地文件服务 (uploads)：鉴权仍由 Node 做。
    # 后端 UPLOADS_X_ACCEL=1 时，鉴权通过后回 X-Accel-Redirect: /_protected_uploads/<category>/<file>，
    # 由下面的 internal location 直接 sendfile；未开启时行为与之前完全一致。
    location /uploads/ {
        proxy_pass http://touliao_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
    }

    # 只接受 X-Accel-Redirect 内部跳转，外部直接访问 → 404。
    # 路径 = 线上后端 config.uploadsRoot（未设 UPLOADS_ROOT、无 legacy backend/uploads，
    # 2026-10-12 核对实际为 backend-v2/uploads）。改了 UPLOADS_ROOT 必须同步改这里。
    # www-data 需能穿过 /home/ubuntu（当前 750，见 APPLY-20261012.md 第 2 步）。
    location /_protected_uploads/ {
        internal;
        alias /home/ubuntu/gh-mirror/touliao/backend-v2/uploads/;
        sendfile on;
        tcp_nopush on;
        # Cache-Control / Content-Type / Content-Disposition 沿用后端原响应头（X-Accel 默认透传）。
    }

    # 落地页 (Next.js 静态导出, basePath /welcome)
    location /welcome/ {
        alias /var/www/touliao-landing/;
        index index.html;
        try_files $uri $uri/ /welcome/index.html;
    }
    location = /welcome { return 301 /welcome/; }

    # 下载站
    # 不开目录列表：客户端与更新源只用固定文件名（latest.yml、*-latest.exe 等），
    # 列表只会把全部历史安装包和候选包暴露给任何人。
    location /downloads/ {
        alias /var/www/downloads/;
        add_header Content-Disposition 'attachment';
    }

    # AI 加速器更新源
    location /ai-updates/ {
        alias /var/www/ai-updates/;
    }
}
