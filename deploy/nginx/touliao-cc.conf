# ⚠️ 这是线上 nginx 配置 /etc/nginx/sites-enabled/touliao-cc.conf 的副本，仅供参考和
# 灾难恢复用（比如服务器重装后，照这份文件重建配置）——**不会自动同步**，只是
# 手动复制进来的一份快照。修改线上配置后，需要手动把改动同步过来
# 再提交，两份文件是否一致完全靠人工纪律维持，见 deploy/README.md
# "nginx 配置纳入版本控制"一节的完整流程说明。
#
# 上次同步：2026-09-14（补 /admin/ 后台面板 location；此前线上缺这段，
# 导致 https://touliao.cc/admin/ 被 SPA fallback 接管、显示前端页面）。
#
# 敏感信息审查（2026-08-30）：全文没有硬编码密码/密钥/token。出现的"敏感看起来的"
# 内容逐项说明，均判定不需要脱敏：
#   - ssl_certificate / ssl_certificate_key：只是 Let's Encrypt 标准路径
#     （/etc/letsencrypt/live/touliao.cc/...），不是证书或私钥内容本身，路径公开
#     不构成风险，且必须是真实路径 nginx 才能启动
#   - 反代到 127.0.0.1:3003 / :8790：均为本机 localhost 回环端口，外部
#     网络不可达，不是可被利用的凭证
#   - server_name touliao.cc / www.touliao.cc：公开域名本身
# 如果以后这份配置里出现了真正的密钥/密码（不应该出现，nginx配置本来就不该放这些），
# 再单独脱敏处理，不要往这个文件里加真实密钥。

# 投聊 touliao.cc — HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name touliao.cc www.touliao.cc;

    # ACME HTTP-01 验证 (证书续期用, 必须留在 80)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/touliao-web;
        default_type text/plain;
    }

    location / { return 301 https://$host$request_uri; }
}

# 投聊 touliao.cc — HTTPS 主站
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name touliao.cc www.touliao.cc;

    ssl_certificate     /etc/letsencrypt/live/touliao.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/touliao.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/touliao-web;
    index index.html;
    client_max_body_size 200m;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 运行时配置（no-cache）——四端启动时读这个决定连哪个后端，
    # 换服务器只改这个文件内容，无需重新编译/发版。
    location = /config.json {
        alias /var/www/touliao-runtime-config/config.json;
        add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
        add_header Content-Type application/json always;
    }

    # 企业代码目录：多客户独立部署共用同一个 App 时，「代码 → 客户自己
    # 的服务器地址」查找表。与 config.json 同样独立存放、同样 no-cache。
    location = /directory.json {
        alias /var/www/touliao-runtime-config/directory.json;
        add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
        add_header Content-Type application/json always;
    }

    # ── 后台管理面板（静态，不走 SPA 回落）──
    # 2026-09-14 补：此前线上缺这段 + /var/www/touliao-admin/ 目录不存在，
    # /admin/ 落到上面的 SPA fallback 显示前端页面。目录由 deploy.yml 步骤 2a-2 发布。
    location = /admin {
        return 301 /admin/;
    }
    location ^~ /admin/ {
        alias /var/www/touliao-admin/;
        index index.html;
        add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
    }

    # API 反代到后端
    location /api/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Socket.io 实时
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # 后端本地文件服务 (uploads)
    location /uploads/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # 落地页 (Next.js 静态导出, basePath /welcome)
    location /welcome/ {
        alias /var/www/touliao-landing/;
        index index.html;
        try_files $uri $uri/ /welcome/index.html;
    }
    location = /welcome { return 301 /welcome/; }

    # 下载站
    location /downloads/ {
        alias /var/www/downloads/;
        autoindex on;
        add_header Content-Disposition 'attachment';
    }

    # AI 加速器更新源
    location /ai-updates/ {
        alias /var/www/ai-updates/;
    }
}
