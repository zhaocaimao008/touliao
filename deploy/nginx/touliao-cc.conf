# ⚠️ 这是线上 nginx 配置 /etc/nginx/conf.d/touliao-cc.conf 的副本，仅供参考和
# 灾难恢复用（比如服务器重装后，照这份文件重建配置）——**不会自动同步**，只是
# 2026-08-30 手动复制进来的一份快照。修改线上配置后，需要手动把改动同步过来
# 再提交，两份文件是否一致完全靠人工纪律维持，见 deploy/README.md
# "nginx 配置纳入版本控制"一节的完整流程说明。
#
# 敏感信息审查（2026-08-30）：全文没有硬编码密码/密钥/token。出现的"敏感看起来"的
# 内容逐项说明，均判定不需要脱敏：
#   - ssl_certificate / ssl_certificate_key：只是 Let's Encrypt 标准路径
#     （/etc/letsencrypt/live/touliao.cc/...），不是证书或私钥内容本身，路径公开
#     不构成风险，且必须是真实路径 nginx 才能启动
#   - 反代到 127.0.0.1:3003 / :8790：均为本机 localhost 回环端口，外部
#     网络不可达，不是可被利用的凭证
#   - server_name touliao.cc / www.touliao.cc：公开域名本身
# 如果以后这份配置里出现了真正的密钥/密码（不应该出现，nginx配置本来就不该放这些），
# 再单独脱敏处理，不要往这个文件里加真实密钥。

# 投聊(touliao) - touliao.cc 域名配置（2026-08-17 招财猫指示启用）
# 后端: 127.0.0.1:3003 | 前端: /var/www/touliao-web

server {
    listen 80;
    listen [::]:80;
    server_name touliao.cc www.touliao.cc;

    # ACME HTTP-01 challenge (Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name touliao.cc www.touliao.cc;

    ssl_certificate     /etc/letsencrypt/live/touliao.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/touliao.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/touliao-web;
    index index.html;

    # ── 健康检查 ──
    location = /health {
        proxy_pass http://127.0.0.1:3003/health;
        proxy_set_header Host $host;
    }

    # ── API 后端（投聊 :3003）────────────────────────────
    # 个推诊断上报：临时排查端点，2026-09-04 关闭。
    # 原先这里转发到 127.0.0.1:3009 的"诊断接收器"，但 3009 早已无任何监听
    # （ss -lntp 只有 3003），线上实测该路径恒返回 502，安卓端的诊断上报一直在吃 502。
    #
    # 这里刻意**不是**删掉这个 location 让它落到下面的 /api/ ——那样会把请求真的送到
    # 后端。后端 controller 侧这个端点原本挂在 /api 的 CSRF 与鉴权之前，唯一凭据是
    # 源码里硬编码、且随 Android APK 分发的静态 token，等于无鉴权；且每次请求会把
    # 调用方可控的 JSON 同步 appendFileSync 进一个无上限增长的文件。删这条 override
    # 等于把这个面从"碰巧打不通"变成真的打通。
    #
    # 故直接在边缘 return 404，与后端加固后的目标状态一致，且不依赖线上部署的是哪版代码。
    # 待后端加固版本（PUSH_DIAG_TOKEN 未配即 404）上线后，这个 location 可以整段删除。
    location = /api/push/getui-diag {
        return 404;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        # 头像/普通文件直传（分片上传走更小分片）：默认 1m 会拒 5MB 头像，放宽与后端 MAX_UPLOAD_BYTES 对齐
        client_max_body_size 200m;
    }
    location = /api-docs {
        proxy_pass http://127.0.0.1:3003/api-docs;
        proxy_set_header Host $host;
    }

    # ── 后台管理面板（静态，不走 SPA 回落）──
    location = /admin {
        return 301 /admin/;
    }
    location ^~ /admin/ {
        alias /var/www/touliao-admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
    }

    # ── 上传文件静态服务（P1-02: 走 Express 鉴权，禁止 nginx 直读）──
    location /uploads/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Socket.IO / WSS ──────────────────────────────────
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # ── 运行时配置（no-cache）────────────────────────────
    # 2026-08-30：从 /var/www/touliao-web/ 迁到独立目录，不再和Web构建产物混放——
    # 此前混放导致一次手动 rsync --delete 部署时把这个文件误删（详见 AUDIT.md 二十一节）。
    location = /config.json {
        alias /var/www/touliao-runtime-config/config.json;
        add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
        add_header Content-Type application/json always;
    }

    # ── 下载客户端静态服务（2026-08-18 补：/downloads 不再被 SPA fallback 吞掉）──
    location /downloads/ {
        alias /var/www/touliao-downloads/;
        add_header Content-Disposition 'attachment';
        try_files $uri =404;
    }

    # ── 落地页（Next.js 静态导出，basePath /welcome；2026-09-03 补：此前 nginx 完全没有
    # 这个 location，请求落进下面的 SPA 回落 location / 返回主 Web 应用的 index.html，
    # 200 状态码掩盖了真实的"落地页从未真正部署过"问题，见 deploy-landing.yml 同批修复）──
    location /welcome/ {
        alias /var/www/touliao-landing/;
        index index.html;
        try_files $uri $uri/ =404;
    }
    location = /welcome {
        return 301 /welcome/;
    }

    # ── v2rayNG 安卓客户端下载（2026-08-28 补：修复被 SPA fallback 吞掉）──
    location /v2rayng/ {
        alias /var/www/v2rayng/;
        add_header Content-Disposition 'attachment';
        try_files $uri =404;
    }

    # ── Vite 静态资源：长期缓存 ──────────────────────────
    location ~* ^/assets/.*\.(js|css|woff2?|ttf|eot|png|jpg|webp|avif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control 'public, immutable' always;
        gzip_static on;
    }

    # ── Service Worker / manifest ───────────────────────
    location = /sw.js {
        add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
        try_files $uri /index.html;
    }
    # 已废弃的 /sw/service-worker.js：这个文件全仓无人注册（只有 /sw.js 会，
    # 见 hooks/usePushNotification.js），已于 2026-09-04 从 web/public 删除。
    # 不能只删掉这个 location 了事——那样请求会落到下面的 SPA 兜底，
    # 于是一个 .js 路径返回 index.html 的 HTML 正文（软 404）。直接 404 才是诚实的。
    location = /sw/service-worker.js {
        return 404;
    }

    # ── 企业微信客服 AI 回调 ──────────────────────────
    location /wework-kf/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── SPA 路由回落 ────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
    }
}
