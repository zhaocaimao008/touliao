# 投聊 brotli（可选，2026-10-12 准备，尚未上线）。线上路径：/etc/nginx/snippets/touliao-brotli.conf
#
# 前置条件：sudo apt-get install libnginx-mod-http-brotli-filter libnginx-mod-http-brotli-static
#   （noble/universe 1.0.0~rc-5build1，依赖 nginx-abi-1.24.0-1，与线上 nginx 1.24.0-2ubuntu7.18 匹配；
#    装包会在 /etc/nginx/modules-enabled/ 放 load_module，对所有站点生效但不开启压缩）
# 未装模块前不要 include 这份文件：brotli 指令未知 → nginx -t 直接失败。
#
# 只在 touliao 的 443 server 块里 include（不放 conf.d 的 http 级，避免改到同机其他站点）：
#     include snippets/touliao-brotli.conf;
#
# brotli_static 需要构建产出 .br 文件：web/vite.config.js 目前只有
#     viteCompression({ algorithm: 'gzip', ext: '.gz', threshold: 1024, deleteOriginFile: false })
# 需再加一行（vite-plugin-compression 0.5.x 支持）：
#     viteCompression({ algorithm: 'brotliCompress', ext: '.br', threshold: 1024, deleteOriginFile: false }),
# 没有 .br 时 brotli_static 回落到 brotli 现场压缩（comp_level 5，CPU 可接受），再回落 gzip_static。
brotli on;
brotli_static on;
brotli_comp_level 5;
brotli_min_length 1024;
# text/html 默认就在列表里，重复写会 nginx -t 警告，故不写
brotli_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;
