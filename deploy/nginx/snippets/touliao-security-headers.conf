# 投聊网页 HTML 的安全响应头（线上路径 /etc/nginx/snippets/touliao-security-headers.conf）。
# nginx 中 location 一旦自己写了 add_header，就不再继承 server 级 add_header，
# 所以需要在带 add_header 的 HTML 入口 location 里显式 include。
# API 的同类响应头由后端 helmet 下发，不在这里。
# CSP 暂未在 HTML 上启用：index.html 含内联脚本，需先做哈希/nonce 再上。
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
